# Strata override of live-build's syslinux_common/menu.cfg.
#
# The only intentional difference is the title. Upstream ships a stray BEL
# character at the end of that line, which is why an anchored match on
# "Boot menu$" silently does nothing; it is preserved here rather than
# quietly dropped, to keep the diff from upstream to one word.

menu hshift 0
menu width 82

menu title Strata
include stdmenu.cfg
include live.cfg
@OPTIONAL_INSTALLER_INCLUDE@
menu begin utilities
	menu label ^Utilities
	menu title Utilities
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit
	include utilities.cfg
menu end

menu clear
