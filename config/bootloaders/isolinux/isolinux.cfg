# Strata override of live-build's isolinux/isolinux.cfg.
#
# Upstream sets "timeout 0", which in syslinux means wait indefinitely. Units are
# tenths of a second, so 100 is 10 seconds — matching the GRUB timeout in
# config/bootloaders/grub-pc/config.cfg.
#
# This is the BIOS boot path. Strata targets UEFI, but leaving the BIOS path
# hanging forever would be gratuitous.

include menu.cfg
default vesamenu.c32
prompt 0
timeout 100
