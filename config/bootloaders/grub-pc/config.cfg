# Strata override of live-build's grub-pc/config.cfg.
#
# live-build copies its own template into place and then overlays this file on
# top (see binary_grub_cfg). The only intentional difference from upstream is the
# timeout below. If live-build's template changes, this copy needs revisiting.
#
# Upstream ships no timeout at all, so the ISO waits at the boot menu forever.
# That blocks any automated QEMU test and is poor behaviour on real hardware too.

set default=0

# Strata addition: auto-boot the default entry after 10 seconds.
set timeout=10

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
