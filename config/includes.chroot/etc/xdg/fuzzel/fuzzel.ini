# Fuzzel is the SUPER+D launcher.
#
# The one setting here that is not cosmetic is "terminal". Desktop entries that
# declare Terminal=true — every CLI tool Strata offers, including the coding
# agents — are started by fuzzel through this command. Fuzzel's built-in default
# is "xterm -e", and xterm is not installed, so without this line those entries
# appear in the menu and silently do nothing when picked.
[main]
terminal=foot -e
prompt=> 
icons-enabled=yes
