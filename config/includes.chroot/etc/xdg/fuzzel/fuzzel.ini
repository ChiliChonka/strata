# Fuzzel is the SUPER+D launcher.
#
# The one setting here that is not cosmetic is "terminal". Desktop entries that
# declare Terminal=true — every CLI tool Strata offers, including the coding
# agents — are started by fuzzel through this command. Fuzzel's built-in default
# is "xterm -e", and xterm is not installed, so without this line those entries
# appear in the menu and silently do nothing when picked.
[main]
terminal=foot -e
prompt=> 
icons-enabled=yes

# Appearance. The palette matches /etc/xdg/quickshell/theme.js, so the launcher
# reads as part of the same desktop as the bar. A user's own
# ~/.config/fuzzel/fuzzel.ini replaces this file entirely.
font=DejaVu Sans:size=11
lines=12
width=38
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=171c22f5
text=c2cad2ff
match=8fb6c9ff
selection=28303aff
selection-text=e9eff4ff
selection-match=8fb6c9ff
border=333d48ff

[border]
width=1
radius=10
