# What happens when the machine is left alone.
#
# hypridle is in ADR-0009's table and was in the session's autostart, but no
# configuration was ever shipped — and hypridle exits immediately without one:
#
#   [CRITICAL] ConfigManager: No hypridle.conf file found
#
# So idle handling silently did nothing at all until this file existed. Found by
# looking at a running machine, not by a test: the checks asked whether mako and
# the polkit agent were running and never asked about this one.
#
# Deliberately short. Two actions, no dimming: dimming needs a backlight, a
# desktop has none, and a step that does nothing on half the machines is worse
# than no step.

general {
    lock_cmd = pidof hyprlock || hyprlock          # avoid a second instance
    before_sleep_cmd = loginctl lock-session       # lock before suspending
    after_sleep_cmd = hyprctl dispatch dpms on     # wake the screen on resume
}

listener {
    timeout = 600                                  # 10 minutes
    on-timeout = loginctl lock-session
}

listener {
    timeout = 780                                  # 13 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
