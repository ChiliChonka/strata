# The lock screen.
#
# Shipped because hyprlock refuses to start without a configuration, exactly as
# hypridle does:
#
#   CRIT: Config path error: Could not find config.
#
# So the session menu's Lock entry did nothing at all, and hypridle's lock would
# have failed the same way. Both were wired up and neither could ever run.
#
# The colours are the scheme's values written out, not read from it. A lock
# screen has to come up when the desktop may already be in trouble, so it
# depends on nothing that could be missing.

general {
    hide_cursor = true
}

background {
    color = rgba(16191dff)
}

# The time, large, because it is the one thing anyone actually wants from a
# lock screen they are walking back to.
label {
    text = $TIME
    color = rgba(ced4dcff)
    font_size = 72
    font_family = Inter Variable
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = $USER
    color = rgba(79818cff)
    font_size = 14
    font_family = Inter Variable
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 320, 48
    rounding = 10
    outline_thickness = 2
    outer_color = rgba(38, 44, 53, 1.0)
    inner_color = rgba(28, 32, 39, 1.0)
    font_color = rgba(206, 212, 220, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(201, 106, 106, 1.0)
    placeholder_text = Password
    fail_text = $FAIL
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}
