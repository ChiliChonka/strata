# The wallpaper.
#
# hyprpaper has been in ADR-0009's table and in the image since the beginning,
# and was never started and never given a wallpaper — the same shape of gap as
# hypridle and hyprlock, which sat configured-less for weeks. The desktop was a
# flat colour and nobody had decided that it should be.
#
# One image, no slideshow, no per-monitor rules: an empty monitor entry applies
# it everywhere, including a display plugged in later.

preload = /usr/share/backgrounds/strata/strata.png
wallpaper = , /usr/share/backgrounds/strata/strata.png

# hyprpaper's own splash text over the wallpaper, which is not wanted.
splash = false
