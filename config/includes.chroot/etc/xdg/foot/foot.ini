# Strata's terminal colours.
#
# The palette matches /etc/xdg/quickshell/theme.js, so a terminal on this
# desktop is the same stone as the bar behind it rather than the default black
# rectangle. Nothing here changes behaviour — a user's ~/.config/foot/foot.ini
# replaces this file entirely.

[main]
font=DejaVu Sans Mono:size=10
pad=10x8

[cursor]
style=beam
blink=no

[colors]
alpha=1.0
background=0c0f12
foreground=c2cad2

selection-background=28303a
selection-foreground=e9eff4

# Normal
regular0=171c22
regular1=c97b72
regular2=83ae87
regular3=c9a06a
regular4=8fb6c9
regular5=a892b8
regular6=7fb0ac
regular7=c2cad2

# Bright
bright0=4d5761
bright1=d99188
bright2=9bc49f
bright3=d9b782
bright4=a9cadb
bright5=bfa9cf
bright6=97c7c3
bright7=e9eff4
