# Strata's foot defaults.
#
# The colours are not here. They come from the active scheme, written out by
# /usr/lib/strata/apply-theme and pulled in by the include below — so switching
# theme does not touch this file, and editing this file does not fight the
# theme. Your own ~/.config/foot/foot.ini overrides both.
include=/etc/strata/theme/foot.ini

[main]
font=JetBrains Mono:size=10, monospace:size=10
pad=8x8
