# Calamares display manager configuration for Strata.
#
# greetd is deliberately NOT in this list, and that is load-bearing. Do not
# "fix" it by adding greetd — doing so breaks the installed system.
#
# Calamares does support greetd (class DMgreetd in the displaymanager module),
# but its implementation assumes a greeter account named "greeter", created by
# basic_setup(). Debian's greetd package creates "_greetd" instead, and
# basicSetup is false below, so basic_setup() never runs. Listing greetd would
# therefore rewrite /etc/greetd/config.toml with
# default_session.user = "greeter", an account that does not exist, and greetd
# would fail to start after installation. It would also replace vt = 7 with
# vt = "next" and strip the file's comments, since the module rewrites the TOML
# wholesale.
#
# With greetd absent from the list, the module finds none of the listed managers
# installed, logs a warning and returns without doing anything. Strata's greetd
# configuration then survives the installation untouched: unpackfs copies
# /etc/greetd/config.toml and the enabled greetd.service straight to disk.
#
# The list below is Debian's, kept verbatim so that a Strata installation
# behaves like a Debian one if any of these ever is installed.

---
displaymanagers:
  - slim
  - sddm
  - lightdm
  - gdm
  - mdm
  - lxdm
  - kdm
basicSetup: false
sysconfigSetup: false
