# Strata identity for the live session.
#
# live-config's init-config.sh sources /etc/live/config.conf.d/*.conf with
# `set -o allexport` before running its components, so setting these here avoids
# lengthening the kernel command line.
#
# These affect the LIVE session only. An installed system gets its hostname and
# user account from Calamares, which asks during installation.

# Without this the greeter reads "Authenticate into debian", live-config's
# default.
LIVE_HOSTNAME="strata"

LIVE_USER_FULLNAME="Strata Live user"
