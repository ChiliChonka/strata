# Strata's wallpaper.
#
# `wallpaper = , path` applies to every output, including ones connected later,
# so a second monitor does not come up black.
#
# The image is generated by scripts/make-wallpaper.py in the Strata repository;
# it is not hand-drawn, and re-rendering it at another resolution is one
# command.

preload = /usr/share/strata/wallpapers/strata-layers.png
wallpaper = , /usr/share/strata/wallpapers/strata-layers.png

# The hyprpaper splash text is Hyprland branding on Strata's wallpaper.
splash = false
ipc = on
