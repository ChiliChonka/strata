# Strata's idle handling.
#
# Used when the user has no ~/.config/hypr/hypridle.conf; the Hyprland config
# picks between the two. Without any configuration hypridle starts, registers no
# listener and does nothing at all, which is indistinguishable from it being
# broken.
#
# Two listeners, in this order: lock first, then turn the panel off. Locking
# before blanking means the screen is already protected by the time it goes
# dark, rather than being lit and unlocked for the last half minute.
#
# Nothing here suspends the machine. Deciding on its own to suspend a laptop
# that is compiling something is a decision this image does not get to make;
# logind's lid and power-key handling already covers the cases where the user
# asked.

general {
    lock_cmd = /usr/lib/strata/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
