# Strata's lock screen.
#
# Used when the user has no ~/.config/hypr/hyprlock.conf of their own; see
# /usr/lib/strata/lock, which decides between the two.
#
# The same wallpaper as the desktop, the same palette as the shell, and one
# input field. Authentication reliability takes precedence over styling
# (BRANDING.md), so there is nothing here that can fail: no screenshot capture,
# no blur pass, no shader, and no fade that could leave the field invisible.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/strata/wallpapers/strata-layers.png
    blur_passes = 0
}

# The time, large, above the input field.
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(233, 239, 244, 1.0)
    font_size = 84
    font_family = DejaVu Sans
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %e %B"
    color = rgba(123, 135, 146, 1.0)
    font_size = 15
    font_family = DejaVu Sans
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = 8
    outline_thickness = 2

    outer_color = rgba(51, 61, 72, 1.0)
    inner_color = rgba(23, 28, 34, 0.94)
    font_color = rgba(233, 239, 244, 1.0)
    check_color = rgba(143, 182, 201, 1.0)
    fail_color = rgba(201, 123, 114, 1.0)

    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true

    placeholder_text = <span foreground="##7b8792">Password</span>
    fail_text = <span foreground="##c97b72">$FAIL</span>

    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}
