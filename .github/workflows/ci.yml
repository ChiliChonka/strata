name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files are present
        run: |
          set -euo pipefail
          missing=0
          for f in README.md AGENTS.md ARCHITECTURE.md MVP.md RELEASES.md \
                   TASKS.md BRANDING.md LICENSE LICENSES.md .gitignore \
                   docs/adr/README.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: No unresolved placeholders
        run: |
          set -euo pipefail
          # <project> was a placeholder in early drafts. It must never come back.
          if grep -rn --include='*.md' -e '<project>' -e 'TODO(placeholder)' .; then
            echo "::error::unresolved placeholder found"
            exit 1
          fi

      - name: Artifact naming is consistent
        run: |
          set -euo pipefail
          # Every documented artifact name must use the strata- prefix.
          if grep -rn --include='*.md' -E '(^|[^a-z-])project-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' .; then
            echo "::error::found a legacy 'project-' artifact name, expected 'strata-'"
            exit 1
          fi

      - name: ADRs are indexed
        run: |
          set -euo pipefail
          rc=0
          for adr in docs/adr/ADR-*.md; do
            base="$(basename "$adr")"
            if ! grep -q "$base" docs/adr/README.md; then
              echo "::error file=$adr::not listed in docs/adr/README.md"
              rc=1
            fi
          done
          exit "$rc"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          # git ls-files, not find: after a local build the working tree holds a
          # chroot/ with thousands of Debian-supplied shell scripts that are not
          # ours to lint. Only tracked files are in scope.
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts tracked — nothing to lint."
            exit 0
          fi
          printf 'Linting %d file(s)\n' "${#files[@]}"
          shellcheck "${files[@]}"
